services:
  postgres:
    image: postgres:17
    container_name: sql-learning-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: learner
      POSTGRES_PASSWORD: learner_local_only
      POSTGRES_DB: sql_learning
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sql_learning_data:/var/lib/postgresql/data
      - ./setup/00_create_learning_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./setup/01_seed_learning_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learner -d sql_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sql_learning_data:
